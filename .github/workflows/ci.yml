name: ci
# Runs on a pull request, and by hand (Actions, ci, Run workflow), which is how main is checked before a release:
# .github/workflows/release.yml publishes only a commit this has passed on. It runs on GitHub's hosted runners unless
# the repository variable CI_RUNNER_LABELS names a runner of the club's own as a JSON list of labels (ci/runner/).
# Dependabot's pull requests always run on hosted runners: they bring third-party code, and a job on the club's runner
# can reach a privileged Docker daemon.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ (github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]') && fromJSON('["ubuntu-latest"]') || fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: booster, POSTGRES_PASSWORD: booster, POSTGRES_DB: booster_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U booster" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: shellcheck scripts/poc/setup.sh scripts/poc/deploy.sh scripts/poc/setup-code.sh scripts/poc/reopen-setup.sh scripts/poc/preview.sh scripts/poc/preview/cloudflare.sh scripts/check-image-secrets.sh scripts/smoke-image.sh scripts/backup.sh scripts/restore.sh scripts/backup-schedule.sh scripts/backup-agent.sh scripts/move-postgres.sh scripts/postgres-guard.sh scripts/focused-run.sh deploy/proxy-start.sh ci/runner/entrypoint.sh ci/runner/job-started.sh
      - name: PowerShell lint
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path scripts/setup -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - run: pnpm typecheck
      - name: Unit and integration tests
        # Test files run in parallel workers. Worker 1 uses booster_test; each other worker makes, migrates and at the end
        # drops a database of its own on the same server (booster_w2_test, ...), which the service's superuser may do.
        # A hosted runner has 4 cores beside Postgres, the club's own (ci/runner/) shares 4: 2 workers. BR_TEST_WORKERS=1 runs the files one at a time, as before.
        # The backup test (tests/integration/backup-restore.test.ts) dumps and restores with Postgres's own tools, which
        # must be no older than the server and not so new that their dumps use settings it lacks. It runs them inside
        # the service's container, as the scripts do in deploy/, so they are always the server's own version.
        env:
          BR_TEST_WORKERS: "2"
          BR_TEST_DB_CONTAINER: ${{ job.services.postgres.id }}
        run: pnpm test
      - name: Build with fake secrets
        env:
          DATABASE_URL: postgres://booster:booster@localhost:5433/booster_test
          APP_URL: http://localhost:3100
          BETTER_AUTH_SECRET: ci-fake-secret-ci-fake-secret-1234567890
          SETTINGS_ENCRYPTION_KEY: Y2ktZmFrZS1rZXktY2ktZmFrZS1rZXktY2ktZmFrZSE=
        run: |
          pnpm build
          node scripts/check-client-bundle.mjs
      - name: E2E
        env:
          DATABASE_URL: postgres://booster:booster@localhost:5433/booster_test
          APP_URL: http://localhost:3100
          BETTER_AUTH_SECRET: ci-fake-secret-ci-fake-secret-1234567890
          SETTINGS_ENCRYPTION_KEY: Y2ktZmFrZS1rZXktY2ktZmFrZS1rZXktY2ktZmFrZSE=
          SETUP_STATUS_CACHE_MS: "0"
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm db:migrate
          pnpm tsx scripts/seed-e2e.ts
          pnpm e2e
  image:
    runs-on: ${{ (github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]') && fromJSON('["ubuntu-latest"]') || fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production image
        run: docker build -t booster-rocket-app:ci .
      - name: Smoke-test the image
        run: bash scripts/smoke-image.sh booster-rocket-app:ci
      - name: No env-file secrets in the image
        run: bash scripts/check-image-secrets.sh
