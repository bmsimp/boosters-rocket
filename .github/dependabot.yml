# Dependency updates, as pull requests a volunteer can read and merge after CI passes. One pull request for each
# package, image and action, never bundled (the owner's choice, 2026-11-17): each says what it changes, CI passes or
# fails on that one change alone, and one that breaks something can be closed without holding back the rest. Security
# fixes come the same way, one at a time, as soon as they are published, whatever the schedule.
#
# GitHub keeps at most five version-update pull requests open per entry unless open-pull-requests-limit says otherwise;
# past that, the next ones are opened only once some of the open ones are merged or closed. Security fixes have their
# own limit of ten, which this file can't change.
#
# Before merging an image update for Documenso, read its release notes and the upgrade notes in
# docs/runbooks/updates.md: the portal was verified against one version of it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Never a new major version of Postgres as an ordinary update: its data must be moved, not pulled
    # (docs/runbooks/updates.md, "Moving to a new major version of Postgres"). Minor versions still come. The build's
    # lead chose this when the installation moved to Postgres 18 (2026-11-17); the owner may change it.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
    # Never a new major version of Postgres as an ordinary update: its data must be moved, not pulled
    # (docs/runbooks/updates.md, "Moving to a new major version of Postgres"). Minor versions still come. The build's
    # lead chose this when the installation moved to Postgres 18 (2026-11-17); the owner may change it.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # CI's Postgres service (.github/workflows/ci.yml) names the postgres image too. Whether this ecosystem ever offers
    # it is not known; if it does, never a new major version of Postgres as an ordinary update: its data must be moved,
    # not pulled (docs/runbooks/updates.md, "Moving to a new major version of Postgres"). The build's lead chose this
    # when the installation moved to Postgres 18 (2026-11-17); the owner may change it.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
