name: booster-rocket
# TZ below only affects server logs and psql output; the app stores times in UTC and the browser shows them in the viewer's own zone.

services:
  db:
    # Postgres 18 keeps its data in /var/lib/postgresql/18/docker, on the volume booster-rocket-postgres. The volume
    # booster-rocket-pgdata is where Postgres 16 kept it: mounted read only, so scripts/postgres-guard.sh refuses to
    # start an empty database while data there hasn't been moved (docs/runbooks/poc-linuxdev.md says how to move it).
    image: postgres:18
    restart: unless-stopped
    entrypoint: ["bash", "/opt/booster-rocket/postgres-guard.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: booster
      POSTGRES_USER: booster
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: America/Chicago
      BR_MOVE_RUNBOOK: 'docs/runbooks/poc-linuxdev.md, section 8, "Moving the database to Postgres 18"'
    volumes:
      - ./scripts/postgres-guard.sh:/opt/booster-rocket/postgres-guard.sh:ro
      - postgres:/var/lib/postgresql
      - pgdata:/old-data:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U booster -d booster"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        # The commit being built, so the Health page can say which version is running (deploy.sh sets it).
        APP_COMMIT: ${APP_COMMIT:-}
    image: booster-rocket-app:current
    container_name: booster-rocket-app
    restart: unless-stopped
    env_file: .env.poc
    environment:
      DATABASE_URL: postgresql://booster:${DB_PASSWORD}@db:5432/booster
      TZ: America/Chicago
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, edge]

  worker:
    # The same image as app, started in worker mode. It has no job logic of its own: every minute it asks the app to
    # run whichever scheduled jobs are due (scripts/worker.mjs). No port, and not on the tunnel's network. It reads
    # nothing from stdin, so nothing here attaches an input.
    image: booster-rocket-app:current
    container_name: booster-rocket-worker
    restart: unless-stopped
    env_file: .env.poc
    environment:
      TZ: America/Chicago
    depends_on:
      app: { condition: service_healthy }
    networks: [internal]
    command: ["node", "tools/scripts/worker.mjs"]
    healthcheck:
      disable: true

  migrate:
    # Same image as app (a separate `build:` here would go stale; profile services aren't rebuilt by `compose build`).
    image: booster-rocket-app:current
    profiles: ["tools"]
    env_file: .env.poc
    environment:
      DATABASE_URL: postgresql://booster:${DB_PASSWORD}@db:5432/booster
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    command: ["node", "tools/scripts/migrate.mjs"]
    restart: "no"

volumes:
  postgres:
    name: booster-rocket-postgres
  # Postgres 16's data, kept until a person removes it (docs/runbooks/poc-linuxdev.md).
  pgdata:
    name: booster-rocket-pgdata

networks:
  internal:
    name: booster-rocket-internal
  edge:
    name: booster-rocket-edge
    external: true
