<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Case Tag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Saira+Stencil+One&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ground:#f2f3f1;--tag:#fff;--ink:#17191e;--ink2:#4a4f58;--club:#5b2a86;--club-ink:#fff;--done:#1e7a4c;--due:#a8590c;--rule:#dcdedb}
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--ground);color:var(--ink);font:16px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif}
.bar{background:var(--club);color:var(--club-ink);height:56px;display:flex;align-items:center;gap:10px;padding:0 16px}
.logo{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--club);display:grid;place-items:center;font:700 13px "Barlow Condensed"}
.bar b{font:700 19px "Barlow Condensed";letter-spacing:.02em}
.bar .me{margin-left:auto;width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.6);display:grid;place-items:center;font-size:13px}
main{padding:18px 16px 0}
h1{font-size:15px;color:var(--ink2);font-weight:400}
.total{display:flex;align-items:flex-end;justify-content:space-between;margin-top:2px}
.amt{font:700 44px/1 "Atkinson Hyperlegible";font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.asof{font-size:13px;color:var(--ink2);margin-top:4px}
.pay{background:var(--ink);color:#fff;border:0;border-radius:10px;height:48px;padding:0 22px;font:700 17px "Atkinson Hyperlegible"}
.lines{margin-top:12px;border-top:1px solid var(--rule)}
.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--rule);font-size:15px}
.line span:last-child{font-variant-numeric:tabular-nums}
.line small{display:block;color:var(--due);font-size:13px}
h2{margin:22px 0 10px;font:700 15px "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.rail{height:2px;background:var(--ink);margin:0 24px;opacity:.5}
.tags{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-1px}
.tag{position:relative;background:var(--tag);border-radius:4px 4px 10px 10px;padding:30px 14px 14px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 14px rgba(0,0,0,.06);clip-path:polygon(18% 0,82% 0,100% 12%,100% 100%,0 100%,0 12%)}
.tag::before{content:"";position:absolute;top:10px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ground);box-shadow:0 0 0 3px var(--club)}
.num{font:400 34px/1 "Saira Stencil One";color:var(--club)}
.name{font-weight:700;font-size:20px;margin-top:6px}
.part{font-size:14px;color:var(--ink2)}
.punch{display:flex;gap:8px;margin-top:12px}
.punch i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.punch i.on{background:var(--ground);border-color:var(--done);box-shadow:inset 0 0 0 3px var(--tag),inset 0 0 0 16px var(--done)}
.state{margin-top:8px;font-size:14px;font-weight:700}
.state.todo{color:var(--due)}.state.ok{color:var(--done)}
.sign{margin-top:10px;width:100%;height:44px;border-radius:10px;border:2px solid var(--club);background:var(--tag);color:var(--club);font:700 15px "Atkinson Hyperlegible"}
nav{position:absolute;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid var(--rule);display:flex}
nav a{flex:1;display:grid;place-items:center;font-size:12px;color:var(--ink2);text-decoration:none;padding-top:8px}
nav a.on{color:var(--club);font-weight:700}
nav svg{width:22px;height:22px;display:block;margin:0 auto 2px}
</style></head><body>
<div class="bar"><div class="logo">FZN</div><b>FZN Band Boosters</b><div class="me">AR</div></div>
<main>
  <h1>The Ramirez family owes</h1>
  <div class="total"><div><div class="amt">$185.00</div><div class="asof">From QuickBooks, as of 2:14 pm</div></div><button class="pay">Pay</button></div>
  <div class="lines">
    <div class="line"><span>Fall uniform fee, Maya<small>Due Nov 15</small></span><span>$85.00</span></div>
    <div class="line"><span>Spring trip deposit, Leo<small>Due Nov 22</small></span><span>$100.00</span></div>
  </div>
  <h2>Your students</h2>
  <div class="rail"></div>
  <div class="tags">
    <div class="tag"><div class="num">42</div><div class="name">Maya</div><div class="part">Flute · Grade 10</div>
      <div class="punch"><i class="on"></i><i></i><i></i></div><div class="state todo">2 forms to sign</div><button class="sign">Sign forms</button></div>
    <div class="tag"><div class="num">17</div><div class="name">Leo</div><div class="part">Percussion · Grade 9</div>
      <div class="punch"><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="state ok">All forms signed</div></div>
  </div>
</main>
<nav>
  <a class="on" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9H3z"/></svg>Home</a>
  <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l3 3v15H6z"/><path d="M9 13l2 2 4-4"/></svg>Forms</a>
  <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>Payments</a>
  <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M15 15c3 0 6 1.5 6 4"/></svg>Family</a>
</nav>
</body></html>
