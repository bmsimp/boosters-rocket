<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Category standard</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#111827;--ink2:#6b7280;--club:#5b2a86;--line:#e5e7eb}
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{background:var(--club);color:#fff;height:56px;display:flex;align-items:center;padding:0 16px;font-weight:600;font-size:17px;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--club);display:grid;place-items:center;font-size:11px;font-weight:700}
main{padding:16px}
h1{font-size:22px;margin-bottom:12px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:14px;color:var(--ink2);font-weight:500}
.amt{font-size:32px;font-weight:700;margin:4px 0 12px}
.btn{display:block;width:100%;height:46px;border:0;border-radius:10px;background:var(--club);color:#fff;font-size:16px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pill{font-size:13px;padding:3px 10px;border-radius:99px;background:#fef3c7;color:#92400e}
.pill.ok{background:#dcfce7;color:#166534}
</style></head><body>
<div class="bar"><div class="logo">FZN</div>FZN Band Boosters</div>
<main>
  <h1>Hi, Ana</h1>
  <div class="card"><h2>Balance due</h2><div class="amt">$185.00</div><button class="btn">Pay now</button></div>
  <div class="card"><h2>Forms</h2>
    <div class="row"><span>Maya</span><span class="pill">2 to sign</span></div>
    <div class="row"><span>Leo</span><span class="pill ok">Complete</span></div></div>
  <div class="card"><h2>Students</h2>
    <div class="row"><span>Maya Ramirez · Flute</span><span>›</span></div>
    <div class="row"><span>Leo Ramirez · Percussion</span><span>›</span></div></div>
</main>
</body></html>
