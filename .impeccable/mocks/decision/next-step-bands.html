<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Next-Step Bands</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--band:#f2c200;--ink:#111;--paper:#fff;--soft:#2b2b2b;--ground:#f4f4f2}
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;background:var(--ground);color:var(--ink);font:16px/1.35 "Atkinson Hyperlegible",system-ui,sans-serif}
.bar{background:var(--ink);color:#fff;height:56px;display:flex;align-items:center;padding:0 16px;font-weight:700;font-size:18px;gap:10px}
.logo{width:32px;height:32px;border-radius:50%;background:var(--band);color:var(--ink);display:grid;place-items:center;font-size:12px}
h1{padding:20px 16px 12px;font-size:22px}
.band{display:flex;align-items:center;gap:14px;background:var(--band);margin:0 0 6px;padding:16px;min-height:104px}
.pic{width:48px;height:48px;background:var(--ink);display:grid;place-items:center;flex:none}
.pic svg{width:30px;height:30px}
.msg{flex:1;font-size:19px;font-weight:700}
.msg small{display:block;font-size:14px;font-weight:400}
.big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.arrow{font-size:30px;font-weight:700}
.quiet{background:var(--paper);color:var(--soft);border-top:2px solid var(--ink)}
.quiet .pic{background:var(--soft)}
.done{padding:16px;color:#555;font-size:15px}
</style></head><body>
<div class="bar"><div class="logo">FZN</div>FZN Band Boosters</div>
<h1>Next for the Ramirez family</h1>
<div class="band"><div class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="1"/><path d="M3 10h18"/></svg></div>
  <div class="msg">Pay 2 invoices<small>Maya's uniform fee and Leo's trip deposit</small></div><div><div class="big">$185</div></div><div class="arrow">→</div></div>
<div class="band"><div class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 3h9l3 3v15H6z"/><path d="M9 13l2 2 4-4"/></svg></div>
  <div class="msg">Sign forms for Maya<small>Code of conduct, travel release</small></div><div class="big">2</div><div class="arrow">→</div></div>
<div class="band quiet"><div class="pic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div>
  <div class="msg">Check your contact details<small>Last updated in August</small></div><div class="arrow">→</div></div>
<p class="done">Done: Leo's forms are all signed.</p>
</body></html>
