<!doctype html>
<!--
  Shown by the service worker (sw.js) when a page can't be loaded because there is no connection.
  It is the only thing the worker ever stores, so it must stay the same for every club and every person:
  no club name or color, no family data, nothing fetched from anywhere. Styles are inline for that reason.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>You're offline</title>
<style>
  :root { color-scheme: light dark; --ground: #f7f7f8; --surface: #ffffff; --border: #e3e4e8; --ink: #18191d; --ink-2: #5c606a; }
  @media (prefers-color-scheme: dark) { :root { --ground: #0f1012; --surface: #16181c; --border: #2a2d33; --ink: #ececee; --ink-2: #a2a6ae; } }
  @media (prefers-contrast: more) { :root { --ground: #ffffff; --border: #18191d; --ink: #000000; --ink-2: #2b2e34; } }
  @media (prefers-contrast: more) and (prefers-color-scheme: dark) { :root { --ground: #000000; --surface: #000000; --border: #ececee; --ink: #ffffff; --ink-2: #e2e4e8; } }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    color: var(--ink); background-color: var(--ground);
    font: 400 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; /* the portal's own fallback stack: its font can't be loaded offline */
  }
  main { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
  svg { width: 28px; height: 28px; display: block; color: var(--ink-2); }
  h1 { font-size: 1.25rem; font-weight: 600; line-height: 1.3; margin-top: 12px; }
  p { margin-top: 6px; color: var(--ink-2); }
  a.btn {
    display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 20px; padding: 0 16px;
    border: 1px solid var(--ink); border-radius: 6px; background: var(--ink); color: var(--surface); font-weight: 500; text-decoration: none;
  }
  a.btn:hover { opacity: 0.88; }
  a.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (forced-colors: active) { main, a.btn { border-color: CanvasText; } }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0M3 3l18 18"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/>
  </svg>
  <h1>You're offline</h1>
  <p>The portal needs a connection to load. Check your Wi-Fi or mobile data, then try again.</p>
  <!-- A link to this same address: the page the person asked for is asked for again. No script, so it works anywhere. -->
  <a class="btn" href="">Try again</a>
</main>
</body>
</html>
